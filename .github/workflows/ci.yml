name: CI

# The fast gate on every change (tests + content validation + lint), and the slow
# ones (all three flavor APKs, and one device run) weekly and on tags, because
# neither assembling every flavor nor booting an emulator on every push buys
# anything — see AGENTS.md §2.
#
# Action majors are pinned to the versions that run on GitHub's current Node
# runtime: the old set (checkout@v4, setup-java@v4, setup-android@v3,
# setup-gradle@v4, upload-artifact@v4) targeted Node 20, which GitHub now forces
# onto Node 24 — every run failed at "Set up Android SDK" because of it.
# Re-check these refs when GitHub announces the next runtime deprecation.
#
# Two independent faults kept CI red, so fix one before concluding anything about
# the other (run #10 was the first green one):
#   1. the Node 20 action set above, which failed during setup, and
#   2. `gradlew` committed as mode 100644 — Windows' core.fileMode=false meant the
#      executable bit never reached git, so on Linux every `./gradlew` step died
#      with exit code 126 ("found but not executable") AFTER setup had succeeded.
# If a run fails only at the Gradle steps, check `git ls-files -s gradlew` prints
# 100755 before touching any Gradle config — see AGENTS.md §2.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Sunday 03:00 UTC — catches toolchain/SDK drift without a change.
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests & content validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Content gate first: a dangling lessonId or an out-of-range correctIndex is a
      # data bug the Kotlin compiler cannot see, and it is the cheaper failure.
      - name: Validate bundled content
        run: ./gradlew validateContent --console=plain

      # B-9: `runCatching` catches CancellationException too, so wrapping a suspend
      # call in it keeps a cancelled coroutine running. feature/ and domain/ must
      # use runCatchingCancellable; a non-suspend use is allowed when the line is
      # marked `runCatching-ok:` with its reason.
      - name: No runCatching around a suspend call
        run: |
          offenders=$(grep -rn "runCatching {" \
            app/src/main/java/org/token/english/feature \
            app/src/main/java/org/token/english/domain \
            | grep -v "runCatching-ok" || true)
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo "::error::runCatching wraps a suspend call — use runCatchingCancellable, or mark the line 'runCatching-ok: <reason>' when the call is not suspend (AGENTS.md §9)."
            exit 1
          fi

      - name: Unit tests (bazaar debug)
        run: ./gradlew :app:testBazaarDebugUnitTest --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/test-results/**
          if-no-files-found: ignore

  # Checklist 0.1 as its own check. Every flow that writes several learner rows per
  # result commits them in one Room transaction, and these five classes are what hold
  # that: four rollback proofs on a real in-memory database (a lesson answer, a review
  # grade, a conversation turn, finishing a lesson, the placement calibration) and the
  # guard that fails when a NEW use case writes two tables without `inTransaction` —
  # or when a registered one is renamed, so coverage cannot vanish quietly. Run on its
  # own so a data-integrity regression is named in the checks list instead of hiding
  # inside the 600-case suite, and required before the release-point assemblies.
  transactions:
    name: Atomic learner writes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Transaction rollback and coverage
        run: >-
          ./gradlew :app:testBazaarDebugUnitTest
          --tests 'org.token.english.AnswerTransactionTest'
          --tests 'org.token.english.EvidenceTransactionTest'
          --tests 'org.token.english.LessonCompletionTransactionTest'
          --tests 'org.token.english.PlacementSeedTransactionTest'
          --tests 'org.token.english.TransactionCoverageTest'
          --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transaction-test-results
          path: app/build/test-results/**
          if-no-files-found: ignore

  lint:
    name: Android Lint (bazaar debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint
        run: ./gradlew :app:lintBazaarDebug --console=plain

      # Warnings are the slippery half: a deliberate deprecation and a "newer
      # version exists" nag look the same once they pile up. The accepted set —
      # with the decision behind each one — is scripts/lint_budget.mjs, and this
      # fails on a new rule, on one that grew, and on an entry that was fixed but
      # not removed from the budget. The decisions are recorded in docs/debt.md.
      - name: Lint budget
        run: node scripts/lint_budget.mjs

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # Release point: every marketplace flavor still builds. Not on every push — only
  # weekly, on a tag, or when a human asks for it.
  assemble:
    name: Assemble all flavors
    # A release build waits for the atomicity gate: a half-written learner record is
    # exactly the kind of defect that should never reach a store upload.
    needs: transactions
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble bazaar, myket and googlePlay debug
        run: >-
          ./gradlew
          :app:assembleBazaarDebug
          :app:assembleMyketDebug
          :app:assembleGooglePlayDebug
          --console=plain

      - name: Upload flavor APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

  # The one question the JVM suite cannot answer: does the app actually start on
  # Android, seed the bundle into Room, and survive a second cold start — with no
  # network. It runs the same harness a human runs on a phone
  # (`scripts/verify_device.sh`: airplane mode, timed cold starts, the seeder's own
  # log line, a logcat crash sweep) with `--require-device`, so an emulator that
  # never booted fails the job instead of passing as "nothing attached".
  #
  # Not on every push: an emulator boot plus a full install costs several minutes,
  # and this is the same release point as `assemble`. It is NOT an instrumented
  # test suite — there is still none (AGENTS §8) — so it proves the launch path,
  # not individual screens.
  device:
    name: Device smoke (emulator)
    needs: transactions
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # GitHub's Linux runners expose /dev/kvm to a group the job user is not in.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Pinned to the v2 line that runs on Node 24 (v2.38.0, Jul 2026) — the same
      # reason the other actions above carry majors newer than their old Node 20
      # releases. Re-check when GitHub announces the next runtime deprecation.
      - name: Boot emulator and run the device check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -no-audio -no-boot-anim
          script: ./scripts/verify_device.sh bazaar --require-device
