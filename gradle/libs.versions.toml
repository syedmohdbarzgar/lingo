[versions]
agp = "9.3.3"
# buildSrc compiles the shared content gate (ContentValidator); keep it on the same
# Kotlin line the app's KSP/compose-compiler plugins pin (KGP 2.2.10 under AGP 9).
kotlin = "2.2.10"
coreKtx = "1.19.0"
coreSplashscreen = "1.0.1"
junit = "4.13.2"
orgJson = "20240303"   # real org.json for JVM unit tests (android.jar stubs are not mocked)
coroutinesTest = "1.10.2"  # ViewModel tests: test Main dispatcher (checklist B-6)
sqliteJdbc = "3.49.1.0"    # host-JVM SQLite, so the migration chain can be executed with real data
robolectric = "4.17"       # Compose screen smoke tests on the host JVM (checklist v15 B-6)
# On-device speech recognition for conversation practice (docs/connectivity.md:
# "an on-device recognizer needs no server"). Vosk ships its own native libs per ABI;
# JNA is required by vosk-android and must be the @aar artifact.
vosk = "0.3.47"
jna = "5.13.0"

junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
# Jetpack (verified against Google Maven metadata, Oct 2026)
composeBom = "2026.09.00"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
lifecycle = "2.9.4"
room = "2.8.5"
datastore = "1.2.1"
# KSP must match AGP 9 built-in Kotlin (KGP 2.2.10) — see AGP 9.0 release notes
ksp = "2.2.10-2.0.2"
# Compose compiler Gradle plugin must match the built-in Kotlin (KGP) version
composeCompiler = "2.2.10"
# Store billing (verified against official docs/artifacts, Oct 2026)
googleBilling = "9.1.0"
poolakey = "2.2.0"        # Cafe Bazaar official SDK (JitPack)
myketBilling = "1.19"     # Myket official SDK (JitPack)

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
# Conversation practice — fully offline ASR (no network, no cloud recognizer).
vosk-android = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk" }
# JNA is declared in app/build.gradle.kts with the `@aar` suffix — version catalogs
# cannot express a packaging classifier, and vosk-android needs the AAR (not the jar).
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Per-store in-app billing (applied to the matching product flavor only)
androidx-billing = { group = "com.android.billingclient", name = "billing", version.ref = "googleBilling" }
poolakey = { group = "com.github.cafebazaar.Poolakey", name = "poolakey", version.ref = "poolakey" }
myket-billing = { group = "com.github.myketstore", name = "myket-billing-client", version.ref = "myketBilling" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# buildSrc only (the content gate runs on the host JVM, no Android plugin there)
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
